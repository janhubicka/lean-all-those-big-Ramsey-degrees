name: Poset diaries and fat trees
on:
  push:
    branches: [poset-diaries-fat-trees]
    paths:
      - 'PosetDiariesFatTrees.lean'
      - 'PosetDiariesFatTrees/**'
      - 'PosetDiariesChecks.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/lean.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poset-diaries-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            .lake
            lake-manifest.json
          key: poset-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            poset-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lean --version
          if [ ! -f lake-manifest.json ]; then lake update; fi
      - name: Get mathlib cache
        run: lake exe cache get
      - name: Build poset-diaries target
        run: lake build PosetDiariesFatTrees
      - name: Reject proof placeholders
        run: |
          if grep -R -nE '^[[:space:]]*(axiom|opaque)[[:space:]]|(^|[[:space:]])(sorry|admit)([[:space:]]|$)' PosetDiariesFatTrees PosetDiariesFatTrees.lean PosetDiariesChecks.lean; then
            exit 1
          fi
      - name: Audit local and imported statements
        run: |
          set -euo pipefail
          lake env lean PosetDiariesChecks.lean | tee poset-diaries-axioms.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("poset-diaries-axioms.txt").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          assert "sorryAx" not in text, text
          for axioms in re.findall(r"depends on axioms:\s*\[([^\]]*)\]", text, re.S):
              unexpected = {a.strip() for a in axioms.split(",") if a.strip()} - allowed
              assert not unexpected, unexpected
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poset-diaries-validation
          path: |
            poset-diaries-axioms.txt
            lake-manifest.json
          if-no-files-found: warn
