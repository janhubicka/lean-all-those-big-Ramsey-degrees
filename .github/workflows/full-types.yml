name: Full type interfaces
on:
  pull_request:
permissions:
  contents: read
jobs:
  full-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: false
      - name: Build new modules and reject unchecked proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake build AllThoseBigRamsey.BinaryFullTypes AllThoseBigRamsey.FullTypeMaps AllThoseBigRamsey.IrreducibleCover
          lake env lean ChecksFullTypes.lean | tee full-type-axioms.txt
          if grep -q 'sorryAx' full-type-axioms.txt; then exit 1; fi
