name: Pseudotree with mathlib and Milliken
on:
  workflow_dispatch:
  push:
    paths:
      - 'AllThoseBigRamsey/Pseudotree/**'
      - 'AllThoseBigRamsey/Pseudotree.lean'
      - 'validation/pseudotree/**'
      - '.github/workflows/pseudotree.yml'
  pull_request:
    paths:
      - 'AllThoseBigRamsey/Pseudotree/**'
      - 'AllThoseBigRamsey/Pseudotree.lean'
      - 'validation/pseudotree/**'
      - '.github/workflows/pseudotree.yml'
permissions:
  contents: read
concurrency:
  group: pseudotree-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: '2'
    defaults:
      run:
        working-directory: validation/pseudotree
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: validation/pseudotree
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Apply documented import-only dependency patches
        run: |
          set -euo pipefail
          for entry in 'milliken milliken.patch' 'ramsey-space-todorcevic ramsey-space.patch'; do
            read -r dependency patch <<< "$entry"
            patch_path="$PWD/import-patches/$patch"
            if git -C ".lake/packages/$dependency" apply --reverse --check "$patch_path"; then
              printf 'Import patch already applied to %s\n' "$dependency"
            else
              git -C ".lake/packages/$dependency" apply --check "$patch_path"
              git -C ".lake/packages/$dependency" apply "$patch_path"
            fi
          done
      - name: Build the actual model and Ramsey adapters
        run: lake build PseudotreeValidation
      - name: Audit all pseudotree proof dependencies
        run: |
          set -euo pipefail
          lake env lean Checks.lean | tee optional-axioms.txt
          if grep -q 'sorryAx' optional-axioms.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: pseudotree-axioms
          path: validation/pseudotree/optional-axioms.txt
